<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>GlobalAlpha</title>
</head>
<body>
    
    <h1>GlobalAlpha</h1>

    <p><strong>X:</strong><span id="eixoX">0 px</span></p>

    <p><strong>Y:</strong><span id="eixoY">0 px</span></p>

    <!-- No "canvas" podemos manipular o "id", "width" e "height". -->
    <canvas id="canvas" width="950px" height="700px">

        <!-- Esse contéudo é exibido caso o navegador não suporte o Canvas! -->
        <h3>Seu browser não possui suporte ao Canvas!</h3>

    </canvas>

    <script type="text/javascript" src="index.js"></script>
    
</body>
</html>
